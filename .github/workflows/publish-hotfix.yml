# PEX — On-Demand Hotfix Publishing
# Accumulate fixes on release-v0.1.0-fix without version bumps.
# When ready: bump version, trigger this workflow to publish.

name: Publish Hotfix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch (e.g. release-v0.1.0-fix)'
        required: true
        default: 'release-v0.1.0-fix'
      version:
        description: 'Release version to publish (e.g. 0.1.1)'
        required: true
      tag_name:
        description: 'Git tag to create (e.g. v0.1.1)'
        required: true

jobs:
  publish:
    name: "Build & Publish"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Build & test
        run: ./gradlew clean build --parallel --no-daemon

      - name: Publish to GitHub Packages
        run: ./gradlew publishToMavenLocal publish --parallel --no-daemon
        env:
          PACKAGE_PAT: ${{ secrets.PACKAGE_PAT }}

      - name: Tag & Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ inputs.tag_name }} -m "Hotfix release ${{ inputs.version }}"
          git push origin ${{ inputs.tag_name }}
          git push origin ${{ inputs.branch }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: "Hotfix ${{ inputs.version }}"
          generate_release_notes: true
          make_latest: false
