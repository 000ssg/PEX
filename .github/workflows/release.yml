# PEX — Release Pipeline
# Triggers on tag push (v0.1.0, v0.2.0, etc.)
# Builds, tests, and publishes to GitHub Packages.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: "Build & Publish"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Build & test
        run: |
          ./gradlew clean build \
            --parallel \
            --no-daemon
        env:
          CI: true

      - name: Publish to GitHub Packages
        run: |
          ./gradlew publishToMavenLocal publish \
            --parallel \
            --no-daemon
        env:
          PACKAGE_PAT: ${{ secrets.PACKAGE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
